<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Hesdor: a local-first AI coding agent for the terminal">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  </style>
  <rect width="1280" height="300" rx="18" fill="#0f1115"/>
  <rect x="72" y="70" width="112" height="112" rx="26" fill="#171a20" stroke="#2f3540" stroke-width="2"/>
  <path d="M102 104 L126 126 L102 148" fill="none" stroke="#3ed6c1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M150 128 L161 139 L150 150 L139 139 Z" fill="#f0b44c"/>
  <text x="214" y="148" class="mono" fill="#eef1f5" font-size="76" font-weight="700" letter-spacing="-2">hesdor</text>
  <text x="216" y="190" class="mono" fill="#9aa3b2" font-size="22">A local-first AI coding agent for the terminal.</text>
  <text x="216" y="222" class="mono" fill="#9aa3b2" font-size="22">Bring any model. No telemetry.</text>
  <rect x="900" y="106" width="320" height="104" rx="12" fill="#171a20" stroke="#2f3540"/>
  <circle cx="922" cy="126" r="5" fill="#ff5f57"/><circle cx="940" cy="126" r="5" fill="#febc2e"/><circle cx="958" cy="126" r="5" fill="#28c840"/>
  <text x="922" y="164" class="mono" font-size="17"><tspan fill="#8cc97a">$</tspan><tspan fill="#eef1f5"> hesdor run "fix the test"</tspan></text>
  <text x="922" y="192" class="mono" font-size="17"><tspan fill="#f0b44c">●</tspan><tspan fill="#7d8594"> Running npm test</tspan></text>
</svg>
