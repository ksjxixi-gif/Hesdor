<svg xmlns="http://www.w3.org/2000/svg" width="838" height="142" viewBox="0 0 838.4 142" role="img" aria-label="hesdor policy check">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:14px;white-space:pre}</style>
<rect x="0.5" y="0.5" width="837.4" height="141" rx="10" fill="#0f1115" stroke="#2a2f38"/>
<path d="M0.5 34V10.5a10 10 0 0 1 10-10H827.9a10 10 0 0 1 10 10V34Z" fill="#191c22"/>
<line x1="0.5" y1="34" x2="837.9" y2="34" stroke="#2a2f38"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="419.2" y="22" fill="#8b93a1" text-anchor="middle" style="font-size:13px">hesdor policy check</text>
<g fill="#d4d8de" xml:space="preserve">
<text x="16.0" y="64" fill="#8cc97a" textLength="58.8" lengthAdjust="spacingAndGlyphs">~/slugs</text>
<text x="83.2" y="64" font-weight="bold" textLength="8.4" lengthAdjust="spacingAndGlyphs">$</text>
<text x="100.0" y="64" textLength="302.4" lengthAdjust="spacingAndGlyphs">hesdor policy check git push --force</text>
<text x="16.0" y="83" textLength="243.6" lengthAdjust="spacingAndGlyphs">ask  [&quot;git&quot;,&quot;push&quot;,&quot;--force&quot;]</text>
<text x="32.8" y="102" textLength="529.2" lengthAdjust="spacingAndGlyphs">effect: interactive: asks first; headless: refused unless --yes</text>
<text x="32.8" y="121" textLength="630.0" lengthAdjust="spacingAndGlyphs">why:    DESTRUCTIVE: forced push or remote deletion rewrites remote history</text>
</g>
</svg>
