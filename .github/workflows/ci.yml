name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      # Windows users usually have autocrlf on; test with it so CRLF bugs show up here first.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # Real sandbox tests (sandbox.test.ts) need bwrap; Ubuntu 24.04's AppArmor blocks its unprivileged user namespaces by default.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Globs, not folders: only Node 26 accepts a directory argument to --test.
      - run: node --test "scripts/release/*.test.mjs" "scripts/screens/*.test.mjs" "scripts/bench/*.test.mjs"
      - run: pnpm build
      - name: Smoke test the bundled CLI
        shell: bash
        run: |
          node packages/cli/bin/hesdor.js --version
          node packages/cli/bin/hesdor.js --help
          # doctor exits 1 when it finds issues (no API key on CI); only a crash should fail the job
          node packages/cli/bin/hesdor.js doctor || [ $? -eq 1 ]
