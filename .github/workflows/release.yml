name: Release

# Push a tag like v0.2.0 (matching packages/cli/package.json) to publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC); provenance is added automatically

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing needs a GitHub-hosted runner
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1

      - name: Check the tag matches the CLI version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/cli version $version"
            exit 1
          fi

      # Same sandbox setup as ci.yml: the sandbox tests fail loudly on Linux CI without bubblewrap.
      - run: |
          sudo apt-get update -q && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # pnpm pack runs prepack (builds every workspace package) and rewrites workspace: ranges.
      - name: Pack the CLI
        working-directory: packages/cli
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

      - name: Smoke test the bundled CLI
        run: |
          test "$(node packages/cli/bin/hesdor.js --version)" = "hesdor ${GITHUB_REF_NAME#v}"
          node packages/cli/bin/hesdor.js --help > /dev/null

      - name: Publish to npm
        run: npm publish "$RUNNER_TEMP"/*.tgz --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # Section of CHANGELOG.md under "## [x.y.z] ..." up to the next "## [" heading, minus link references.
          awk -v v="$version" '/^## \[/ { if (on) exit; on = index($0, "## [" v "]") == 1; next } /^\[[^]]*\]: / { next } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # Standalone binaries (Node.js single executable applications), built and smoke-tested natively per OS/arch.
  # Independent of the npm publish above, so a failed binary build never blocks npm. Nothing is code-signed yet.
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win-x64, exe: hesdor.exe }
          - { os: ubuntu-latest, target: linux-x64, exe: hesdor }
          - { os: ubuntu-24.04-arm, target: linux-arm64, exe: hesdor }
          - { os: macos-latest, target: macos-arm64, exe: hesdor }
          - { os: macos-15-intel, target: macos-x64, exe: hesdor }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26 # `node --build-sea` needs >= 25.5; this node is what the binary embeds
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/release/build-binaries.mjs
      - name: Smoke test the binary (version, help, doctor, headless run against a fake model)
        run: node scripts/release/smoke-binary.mjs "dist/release/work/${{ matrix.exe }}" "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: hesdor-${{ matrix.target }}
          path: dist/release/hesdor-${{ matrix.target }}.*
          if-no-files-found: error

  release-assets:
    needs: [publish, binaries] # the GitHub release is created by the publish job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hesdor-*
          path: assets
          merge-multiple: true
      - name: Upload binaries and SHA256SUMS to the release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: assets
        run: |
          sha256sum hesdor-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" hesdor-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
